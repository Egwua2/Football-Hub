name: Account recovery and build checks

on:
  push:
    branches:
      - email-otp-validation
      - refurbish-squad-battle-voting
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: footballhub-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: footballhub-frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  backend:
    name: Backend Maven build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build backend
        working-directory: footballhub
        run: bash ./mvnw -B -DskipTests package
