services:
  backend:
    build:
      context: ./footballhub
      dockerfile: Dockerfile
    container_name: footballhub-backend
    env_file:
      - .env
    environment:
      PORT: "8080"
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./footballhub-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: footballhub-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
