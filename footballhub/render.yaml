services:
  # MySQL uses a persistent Render disk so data survives restarts and deploys.
  - type: pserv
    name: footballhub-mysql
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./footballhub/deployment/mysql/Dockerfile
    dockerContext: ./footballhub/deployment/mysql
    disk:
      name: footballhub-mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 1
    envVars:
      - key: MYSQL_DATABASE
        value: footballhub
      - key: MYSQL_USER
        value: footballhub
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  # Spring Boot API.
  - type: web
    name: footballhub-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./footballhub/Dockerfile
    dockerContext: ./footballhub
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:mysql://footballhub-mysql:3306/footballhub?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - key: SPRING_DATASOURCE_USERNAME
        fromService:
          type: pserv
          name: footballhub-mysql
          envVarKey: MYSQL_USER
      - key: SPRING_DATASOURCE_PASSWORD
        fromService:
          type: pserv
          name: footballhub-mysql
          envVarKey: MYSQL_PASSWORD
      - key: APP_CORS_ALLOWED_ORIGIN_PATTERNS
        value: http://localhost:5173,https://*.vercel.app
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: SPRING_JPA_SHOW_SQL
        value: "false"
