spring.application.name=footballhub

server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/footballhub}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_FORMAT_SQL:false}

# Password reset emails are sent through EmailJS over HTTPS.
app.email.enabled=${APP_EMAIL_ENABLED:false}
app.email.emailjs.service-id=${EMAILJS_SERVICE_ID:}
app.email.emailjs.template-id=${EMAILJS_TEMPLATE_ID:}
app.email.emailjs.public-key=${EMAILJS_PUBLIC_KEY:}
app.email.emailjs.private-key=${EMAILJS_PRIVATE_KEY:}
